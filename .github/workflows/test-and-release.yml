name: Test and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run regression tests
        run: php tests/run.php
      - name: Build installation ZIP
        run: python3 scripts/package.py

  wordpress:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / ${{ matrix.folder }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '5.8'
            php: '7.4'
            folder: wordpress-at-head-tag
          - wordpress: latest
            php: '8.3'
            folder: wordpress-at-head-tag-main
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, zip
          tools: wp-cli:2.12.0
          coverage: none
      - name: Package and install WordPress
        env:
          WP_VERSION: ${{ matrix.wordpress }}
          PLUGIN_FOLDER: ${{ matrix.folder }}
        run: |
          set -euo pipefail
          python3 scripts/package.py
          wp core download --path="$RUNNER_TEMP/wordpress" --version="$WP_VERSION"
          wp config create --path="$RUNNER_TEMP/wordpress" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$RUNNER_TEMP/wordpress" --url=http://127.0.0.1:8080 --title=Test --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          unzip -q dist/at-head-tag.zip -d "$RUNNER_TEMP/wordpress/wp-content/plugins"
          if [ "$PLUGIN_FOLDER" != wordpress-at-head-tag ]; then
            mv "$RUNNER_TEMP/wordpress/wp-content/plugins/wordpress-at-head-tag" "$RUNNER_TEMP/wordpress/wp-content/plugins/$PLUGIN_FOLDER"
          fi
          wp plugin activate "$PLUGIN_FOLDER" --path="$RUNNER_TEMP/wordpress"
      - name: Verify WordPress update discovery and installation
        env:
          AHT_PACKAGE: ${{ github.workspace }}/dist/at-head-tag.zip
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress.php" --path="$RUNNER_TEMP/wordpress"
      - name: Verify real front-end output
        run: python3 tests/frontend.py

  release:
    name: Publish stable release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [regression, wordpress]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: at-head-tag-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Package the tested source
        run: python3 scripts/package.py
      - name: Read release metadata
        id: metadata
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('at-head-tag.php').read_text()
          def header(name):
              value = re.search(r'^ \* ' + re.escape(name) + r': ([0-9.]+)$', text, re.M)
              assert value, name
              return value.group(1)
          version = header('Version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'tag=v{version}\n')
          notes = f"Requires WordPress: {header('Requires at least')}\nRequires PHP: {header('Requires PHP')}\n\n"
          notes += pathlib.Path('CHANGELOG.md').read_text().split(f'## {version}\n', 1)[1].split('\n## ', 1)[0].strip()
          pathlib.Path('dist/release-notes.md').write_text(notes + '\n')
          PY
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = false ]; then
              echo "Release $RELEASE_TAG is already published; nothing to overwrite."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "At Head Tag $RELEASE_TAG" --notes-file dist/release-notes.md --draft
          fi
          gh release upload "$RELEASE_TAG" dist/at-head-tag.zip --clobber
          gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.md --draft=false --latest
