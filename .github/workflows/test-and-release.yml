name: Test and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: PHP ${{ matrix.php }} regression
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Run regression tests
        run: php tests/run.php
      - name: Build installation ZIP
        run: python3 scripts/package.py

  wordpress:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }} / ${{ matrix.folder }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '5.8'
            php: '7.4'
            folder: wordpress-at-head-tag
          - wordpress: latest
            php: '8.3'
            folder: wordpress-at-head-tag-main
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, dom, zip
          tools: wp-cli:2.12.0
          coverage: none
      - name: Package and install WordPress
        env:
          WP_VERSION: ${{ matrix.wordpress }}
          PLUGIN_FOLDER: ${{ matrix.folder }}
        run: |
          set -euo pipefail
          python3 scripts/package.py
          wp core download --path="$RUNNER_TEMP/wordpress" --version="$WP_VERSION"
          wp config create --path="$RUNNER_TEMP/wordpress" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$RUNNER_TEMP/wordpress" --url=http://127.0.0.1:8080 --title=Test --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          unzip -q dist/at-head-tag.zip -d "$RUNNER_TEMP/wordpress/wp-content/plugins"
          if [ "$PLUGIN_FOLDER" != wordpress-at-head-tag ]; then
            mv "$RUNNER_TEMP/wordpress/wp-content/plugins/wordpress-at-head-tag" "$RUNNER_TEMP/wordpress/wp-content/plugins/$PLUGIN_FOLDER"
          fi
          wp plugin activate "$PLUGIN_FOLDER" --path="$RUNNER_TEMP/wordpress"
      - name: Verify WordPress update discovery and installation
        env:
          AHT_PACKAGE: ${{ github.workspace }}/dist/at-head-tag.zip
        run: wp eval-file "$GITHUB_WORKSPACE/tests/wordpress.php" --path="$RUNNER_TEMP/wordpress"
      - name: Verify real front-end output
        run: python3 tests/frontend.py

  release:
    name: Publish stable release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [regression, wordpress]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: at-head-tag-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Package the tested source
        run: python3 scripts/package.py
      - name: Read release metadata
        id: metadata
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('at-head-tag.php').read_text()
          def header(name):
              value = re.search(r'^ \* ' + re.escape(name) + r': ([0-9.]+)$', text, re.M)
              assert value, name
              return value.group(1)
          version = header('Version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'tag=v{version}\n')
          notes = f"Requires WordPress: {header('Requires at least')}\nRequires PHP: {header('Requires PHP')}\n\n"
          notes += pathlib.Path('CHANGELOG.md').read_text().split(f'## {version}\n', 1)[1].split('\n## ', 1)[0].strip()
          pathlib.Path('dist/release-notes.md').write_text(notes + '\n')
          PY
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft"; then
            if [ "$(cat "$RUNNER_TEMP/release-draft")" = false ]; then
              echo "Release $RELEASE_TAG is already published; nothing to overwrite."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "At Head Tag $RELEASE_TAG" --notes-file dist/release-notes.md --draft
          fi
          gh release upload "$RELEASE_TAG" dist/at-head-tag.zip --clobber
          gh release edit "$RELEASE_TAG" --notes-file dist/release-notes.md --draft=false --latest


  production_update:
    name: Production updater smoke test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, dom, zip
          tools: wp-cli:2.12.0
          coverage: none
      - name: Install WordPress and previous public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_version="$(php -r '$text=file_get_contents("at-head-tag.php"); preg_match("/^ \\* Version: ([0-9.]+)$/m",$text,$m); echo $m[1];')"
          current_tag="v$current_version"
          previous_tag="$(gh release list --limit 20 --json tagName --jq '[.[].tagName | select(. != env.current_tag)][0]' 2>/dev/null || true)"
          if [ -z "$previous_tag" ] || [ "$previous_tag" = "null" ]; then
            previous_tag="$(gh release list --limit 20 --json tagName --jq ".[] | select(.tagName != \"$current_tag\") | .tagName" | head -n1)"
          fi
          test -n "$previous_tag"
          previous_version="${previous_tag#v}"
          mkdir -p "$RUNNER_TEMP/previous-release"
          gh release download "$previous_tag" --pattern at-head-tag.zip --dir "$RUNNER_TEMP/previous-release"
          wp core download --path="$RUNNER_TEMP/wordpress" --version=latest
          wp config create --path="$RUNNER_TEMP/wordpress" --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3306
          wp core install --path="$RUNNER_TEMP/wordpress" --url=http://127.0.0.1:8080 --title=UpdaterTest --admin_user=admin --admin_password=integration-only --admin_email=test@example.com --skip-email
          wp plugin install "$RUNNER_TEMP/previous-release/at-head-tag.zip" --activate --path="$RUNNER_TEMP/wordpress"
          installed="$(wp plugin get wordpress-at-head-tag --field=version --path="$RUNNER_TEMP/wordpress")"
          test "$installed" = "$previous_version"
          printf 'PREVIOUS_VERSION=%s\nCURRENT_VERSION=%s\n' "$previous_version" "$current_version" >> "$GITHUB_ENV"
      - name: Discover current public release through the plugin updater
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if wp eval '
              delete_site_transient( At_Head_Tag_Updater::CACHE_KEY );
              delete_site_transient( "update_plugins" );
              wp_update_plugins();
              $updates = get_site_transient( "update_plugins" );
              $basename = plugin_basename( AT_HEAD_TAG_FILE );
              if ( isset( $updates->response[ $basename ] ) ) {
                echo $updates->response[ $basename ]->new_version;
                exit( 0 );
              }
              exit( 1 );
            ' --path="$RUNNER_TEMP/wordpress" | grep -Fx "$CURRENT_VERSION"; then
              exit 0
            fi
            sleep 5
          done
          echo "The previous public release did not discover $CURRENT_VERSION through GitHub."
          exit 1
      - name: Update through WordPress and verify installed version
        run: |
          set -euo pipefail
          wp plugin update wordpress-at-head-tag --path="$RUNNER_TEMP/wordpress"
          installed="$(wp plugin get wordpress-at-head-tag --field=version --path="$RUNNER_TEMP/wordpress")"
          test "$installed" = "$CURRENT_VERSION"
          wp plugin is-active wordpress-at-head-tag --path="$RUNNER_TEMP/wordpress"
          echo "PASS: At Head Tag $PREVIOUS_VERSION updated through the public GitHub release to $CURRENT_VERSION."
